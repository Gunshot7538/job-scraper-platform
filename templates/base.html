    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Job Manager</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Favicon -->
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><rect x='2' y='7' width='20' height='14' rx='2'/><path d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16' stroke='white' stroke-width='2'/></svg>">

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f4f7fb;
                margin: 0;
                padding: 0;
            }

            .top-bar {
                background: #111827;
                color: white;
                padding: 15px 25px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: space-between;
                align-items: center;
            }

            .top-bar a {
                color: white;
                margin-left: 15px;
                text-decoration: none;
            }

            .top-bar a:hover {
                text-decoration: underline;
            }

            .msg {
                padding: 10px;
                background: #e8f5e9;
                color: green;
                margin: 10px;
                border-radius: 6px;
            }

            /* Star partial fill */
            .star-fill {
                position: absolute;
                top: 0;
                left: 0;
                overflow: hidden;
                white-space: nowrap;
                color: #f5a623;
                font-size: 18px;
            }
        </style>
    </head>

    <body>

        <!-- NAVBAR -->
        {% block navbar %}
        <div class="top-bar">
            <h4 style="margin:0; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #6366f1;">
                    <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                Smart Job Manager
            </h4>

            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="{% url 'home' %}" style="display: flex; align-items: center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Home
                </a>
                {% if user.is_authenticated %}
                    <!-- <a href="{% url 'dashboard' %}">📊 Dashboard</a> -->
                    <!-- <a href="{% url 'logout' %}" style="background: rgba(239, 68, 68, 0.2); padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">🚪 Logout</a> -->
                {% else %}
                    <a href="{% url 'login' %}" style="display: flex; align-items: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                            <path d="M2 12h20"></path>
                        </svg>
                        Login
                    </a>
                    <a href="{% url 'signup' %}" style="background: #6366f1; padding: 6px 14px; border-radius: 8px; font-weight: 600; display: flex; align-items: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                            <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"></path>
                        </svg>
                        Signup
                    </a>
                {% endif %}
            </div>
        </div>
        {% endblock %}

        <!-- MESSAGES -->
        {% block messages %}
        {% if messages %}
            {% for message in messages %}
                <div class="msg">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endblock %}

        <!-- MAIN CONTENT -->
        {% block content %}{% endblock %}

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
