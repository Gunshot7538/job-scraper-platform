{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}
<!-- Modern Typography -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #6366f1;
    --bg: #030209;
    --card-bg: rgba(13, 11, 30, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --t1: #f8fafc;
    --t2: #94a3b8;
  }

  body {
    background: var(--bg) !important;
    font-family: 'Outfit', sans-serif;
    color: var(--t1);
    margin: 0;
  }

  .page-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(1.5rem, 5vw, 3rem);
    width: 100%;
    max-width: 440px;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .card h2 {
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 800;
    text-align: center;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    text-align: center;
    font-size: 0.9375rem;
    color: var(--t2);
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--t1);
    outline: none;
    transition: 0.2s;
  }

  .form-group input:focus {
    border-color: var(--primary);
    background: rgba(255, 255, 255, 0.05);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .bottom-link {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--t2);
  }

  .bottom-link a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<div class="page-wrapper">
  <div class="card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Securely log in to your account</p>

    <!-- Error/Success Messages -->
    {% if messages %}
    {% for message in messages %}
    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">

      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" name="username" id="username" placeholder="Enter your credentials" autocapitalize="none"
          autocorrect="off" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="{% url 'password_reset' %}" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <p class="bottom-link">
      New here? <a href="{% url 'signup' %}">Create an Account</a>
    </p>
  </div>
</div>
{% endblock %}
