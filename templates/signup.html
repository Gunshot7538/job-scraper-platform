{% extends 'base.html' %}

{% block content %}
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .page-wrapper { min-height: 100vh; background: #eef0f5; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  .card { background: #fff; border-radius: 20px; padding: 48px 44px 40px; width: 100%; max-width: 480px; }
  .card h2 { font-size: 32px; font-weight: 700; color: #3d3db8; text-align: center; margin: 0 0 8px; }
  .subtitle { text-align: center; font-size: 15px; color: #555; font-weight: 500; margin: 0 0 32px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: #222; margin-bottom: 8px; }
  .field input { width: 100%; padding: 16px 18px; border-radius: 12px; border: none; background: #f0f3f8; font-size: 15px; color: #333; outline: none; transition: background 0.2s; }
  .field input:focus { background: #e6e8f5; }
  .field input::placeholder { color: #aaa; }
  .btn { width: 100%; padding: 18px; background: #4a4acf; color: #fff; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; margin: 8px 0 24px; position: relative; overflow: hidden; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease; }
  .btn:hover { background: #3a3abf; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,74,207,0.35); }
  .btn:active { transform: scale(0.97) translateY(0); box-shadow: none; }
  .btn .btn-text { transition: opacity 0.2s; }
  .btn .spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .btn.loading .btn-text { opacity: 0; }
  .btn.loading .spinner { display: block; }
  .btn.success { background: #2ecc71; pointer-events: none; }
  .btn.success .btn-text { opacity: 1; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); transform: scale(0); animation: ripple-anim 0.5s linear; pointer-events: none; }
  @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
  .bottom-link { text-align: center; font-size: 14px; color: #888; margin: 0; }
  .bottom-link a { color: #4a4acf; font-weight: 700; text-decoration: none; }
</style>

<div class="page-wrapper">
  <div class="card">
    <h2 style="font-size: 32px; font-weight: 800; text-align: center; margin: 0 0 8px; background: linear-gradient(90deg, #3d3db8, #6b6bdf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Hi Job Seekers</h2>
    <p class="subtitle">Let's build your professional profile</p>
    {{ form.errors }}
    <form method="POST" id="signupForm">
      {% csrf_token %}



      <div class="field">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" placeholder="Enter username" required />
</div>

   
      <div class="field">
        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" placeholder="••••••••" required />
      </div>

      <div class="field">
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" placeholder="Re-enter your password" required />
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="btn-text" id="btnText">Create Account</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="bottom-link">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
  </div>
</div>

<script>
  var btn = document.getElementById('submitBtn');
  var btnText = document.getElementById('btnText');
  var form = document.getElementById('signupForm');

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    var rect = btn.getBoundingClientRect();
    var ripple = document.createElement('span');
    var size = Math.max(rect.width, rect.height);
    ripple.classList.add('ripple');
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 500);
    btn.classList.add('loading');
    btn.disabled = true;
    setTimeout(function() {
      btn.classList.remove('loading');
      btn.classList.add('success');
      btnText.textContent = 'Creating Account...';
      setTimeout(function() { form.submit(); }, 600);
    }, 1200);
  });
</script>

{% endblock %}
